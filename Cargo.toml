[package]
name = "celeste"
version = "0.8.3"
edition = "2024"
license = "GPL-3.0-or-later"
authors = [
    "Hunter Wittenborn <hunter@hunterwittenborn.com>",
    "Alexander Menzel <menzel.alexander@proton.me>",
]
repository = "https://github.com/hwittenborn/celeste"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
file-lock = "2.1.11"
futures = "0.3.32"
glob = "0.3.3"
iced = { version = "0.12", features = ["tokio"] }
libc = "0.2"
# Celeste's combined Go archive — provides the librclone RPC surface
# (drop-in replacement for the upstream `librclone` crate) plus the
# native ProtonDrive entry points. See `native-go/` for the Go side.
librclone = { package = "celeste-native-sys", path = "native-go" }
sea-orm = { version = "0.10.7", features = ["sqlx-sqlite", "runtime-async-std-rustls", "macros"] }
sea-orm-migration = "0.10.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["serde-well-known"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "sync"] }
tr = "0.1.11"
